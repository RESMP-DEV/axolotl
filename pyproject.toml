[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm>=8", "packaging==26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axolotl"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "LLM Trainer"
readme = "README.md"
requires-python = ">=3.10"
# license = "Apache-2.0"

[project.scripts]
axolotl = "axolotl.cli.main:main"

[project.urls]
Homepage = "https://axolotl.ai/"
Documentation = "https://docs.axolotl.ai/"
Repository = "https://github.com/axolotl-ai-cloud/axolotl.git"

[tool.setuptools_scm]

[tool.setuptools]
py-modules = ["setuptools_axolotl_dynamic_dependencies"]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.cmdclass]
build_py = "setuptools_axolotl_dynamic_dependencies.BuildPyCommand"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "I"]
ignore = [
    "E203",  # Whitespace before ':'
    "E501",  # Line too long
    "C901",  # Too complex
    "B019",  # Use of functools.cache on methods
    "E722",  # Bare except
    "F821",  # Undefined name (for dynamic exec)
]

[tool.ruff.lint.isort]
known-third-party = ["wandb", "comet_ml"]
known-local-folder = ["src", "tests"]
# Black-compatible isort settings
force-single-line = false
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.format]
# Use black's formatting style exactly
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow",
]

[tool.uv.extra-build-dependencies]
axolotl = ["huggingface_hub"]

# ── uv-first configuration ──────────────────────────────────────────────────────
# Best practices for using uv with this repo:
#   1. Create venv:    uv venv .venv
#   2. Install torch:  uv pip install torch==2.8.0+cu128 --index-url https://download.pytorch.org/whl/cu128
#   3. Install axolotl: uv pip install -e ".[hopper,flash-attn,deepspeed]"
#   4. Build FA3 from source (Hopper only, see AGENTS.md "H100 Footguns" section)
#
# Note: uv handles dependency resolution much faster than pip and respects
# the extras defined in setup.py.  The "hopper" extra includes ax-platform,
# botorch, and ninja for hyperparameter sweeps on H100/H200 GPUs.

[tool.uv.sources]
# Force PyTorch from the CUDA wheel index (not PyPI).
# Uncomment and adjust the CUDA version if needed:
# torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
